concurrency:
  group: criterion-label-${{ github.event.issue.number || 'all' }}
  cancel-in-progress: false

jobs:
  criterion-label:
    runs-on: "ubuntu-24.04"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
