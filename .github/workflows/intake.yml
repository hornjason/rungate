name: Intake — fix commits

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  fix-commit-intake:
    runs-on: "ubuntu-24.04"
    steps:
      # Full history: a depth-1 clone is the only reason this source reads
      # UNMEASURED (SHALLOW_HISTORY) on a runner.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          # Pinned by .bun-version — the project's single declaration (#622).
          # setup-bun reads that file, so there is no version spelled here to drift from it.
          bun-version-file: ".bun-version"
        env:
          # A per-runner install path, so runners sharing a HOME cannot rewrite
          # each other's bun mid-exec ("Text file busy").
          HOME: ${{ runner.tool_cache }}/bun-home
          USERPROFILE: ${{ runner.tool_cache }}/bun-home
      - name: Mine fix commits into rule candidates
        run: |
          out=$(bunx rungate@0.8.31 intake --source fix-commits)
          printf '%s\n' "$out"
          case "$out" in
            *UNMEASURED*)
              echo "::warning::UNMEASURED — the fix-commits intake reading could not be taken on this run; the reason is printed above. This is not zero candidates."
              ;;
          esac
