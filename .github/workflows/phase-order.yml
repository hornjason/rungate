# Not managed by rungate — caller-owned, like adr-accepted.yml.
#
# #2015: an issue's milestone decides its phase, and plan-deps turns phase
# order into blocked-by edges. Until this ran, plan-deps --write ran only when
# an ADR merged (adr-accepted.yml), so an issue milestoned by hand afterwards
# got no order link until somebody remembered the command. The 2026-11-12 dry
# run found #1719 missing its link to #1752.
#
# #2062 / SC-2609: the same event also gives the issue what the board needs.
# Six issues milestoned by hand on 2026-11-12 got no queue label and no
# Criteria cell, and `queue-label` and `criteria-field` fell with them (#2020).
# So this also runs board-mirror twice: once to add the queue label, once to
# write the Criteria column. And it links the family of the milestone that
# changed, not only the engine's: #1934 placed in a Convergence phase on
# 2026-11-13 left `dependency-edges` 9 short because only `Pipeline` was run.
#
# Every step is idempotent: each reads the whole tracker or board and writes
# only what is missing, so it does not matter which issue fired the run, and
# an issue milestoned by a tool (whose GITHUB_TOKEN write fires no event) is
# repaired by the next run.
#
# CREDENTIALS, per ADR-013: issues, labels and edges are written with the
# job's own GITHUB_TOKEN, passed as GITHUB_TOKEN. Those writes fire no further
# workflow runs, so they cannot re-trigger this one. RUNGATE_PROJECT_TOKEN is
# held in the env of the one step that writes the Criteria column, and nowhere
# else; there is no job-level env for a step to inherit it from.
#
# No trust gate: setting or clearing a milestone needs triage access or above,
# so a stranger cannot fire this. That is also why `edited` is NOT a trigger:
# an issue's author can edit its body without any access, and that would put
# the board token behind an event anybody can raise.
#
# Every `uses:` is pinned to a full commit SHA. `test/phase-order-workflow.test.ts`
# asserts that and the rest.
name: Phase order — re-link on a milestone change

on:
  issues:
    types: [milestoned, demilestoned]

permissions:
  contents: read
  issues: write

# Re-milestoning ten issues fires ten runs. They queue, so two never write the
# same edge at once; GitHub keeps only the newest pending one, which is enough
# because every run reads the whole tracker.
concurrency:
  group: phase-order
  cancel-in-progress: false

jobs:
  phase-order:
    runs-on: "ubuntu-latest"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.0.2
        with:
          bun-version-file: ".bun-version"
      - run: bun install --frozen-lockfile --ignore-scripts

      # The prefix is read through lib/config-readers.ts, the one loader. An
      # unconfigured prefix is a red run, not a skipped step: a skipped step
      # reads as satisfied.
      - id: prefix
        name: Which milestones are the engine's phases?
        run: |
          prefix=$(bun -e 'import { readBoardInputs } from "./lib/config-readers"; process.stdout.write(readBoardInputs(".").milestonePrefix ?? "")')
          if [ -z "$prefix" ]; then
            echo "::error::UNMEASURED — board.milestonePrefix must be set in .claude/rungate/config.json to write phase order. Nothing was written."
            exit 1
          fi
          # A newline would write a second key into GITHUB_OUTPUT.
          case "$prefix" in
            *$'\n'*)
              echo "::error::board.milestonePrefix contains a newline. Nothing was written."
              exit 1
              ;;
          esac
          echo "prefix=$prefix" >> "$GITHUB_OUTPUT"

      - name: Phase-order links between milestones
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREFIX: ${{ steps.prefix.outputs.prefix }}
        run: bun scripts/plan-deps.ts --repo "$GITHUB_REPOSITORY" --milestone-prefix "$PREFIX" --write

      # #2062: the family of the milestone that fired this run, through
      # familyOf, the one grammar for a phase title. Written only when it is a
      # family other than the engine's, which the step above already linked.
      # familyOf cannot return a newline (it anchors, and `.` stops at one), so
      # unlike the prefix this cannot forge an output key; the test asserts it.
      - id: family
        name: Which family does the changed milestone belong to?
        env:
          MILESTONE: ${{ github.event.milestone.title }}
          PREFIX: ${{ steps.prefix.outputs.prefix }}
        run: |
          family=$(bun -e 'import { familyOf } from "./lib/spec-placement"; process.stdout.write(familyOf(process.env.MILESTONE) ?? "")')
          if [ -n "$family" ] && [ "$family" != "$PREFIX" ]; then
            echo "family=$family" >> "$GITHUB_OUTPUT"
          fi

      - name: Phase-order links for the changed milestone's family
        if: steps.family.outputs.family != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FAMILY: ${{ steps.family.outputs.family }}
        run: bun scripts/plan-deps.ts --repo "$GITHUB_REPOSITORY" --milestone-prefix "$FAMILY" --write

      - name: Queue label on every engine-phase issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun scripts/board-mirror.ts --queue-label --repo "$GITHUB_REPOSITORY" --write

      # THE ONE STEP HOLDING THE BOARD TOKEN. The same command adr-accepted.yml
      # runs; without --ready it writes the Criteria column and never Status,
      # which board-ready.yml owns and which fires on this same event. An absent
      # secret is the empty string with no error, so board-mirror's own refusal
      # ("not a project this token can read") is what reports it.
      - name: Criteria column on the board
        env:
          GITHUB_TOKEN: ${{ secrets.RUNGATE_PROJECT_TOKEN }}
          PROJECT_ID: ${{ vars.RUNGATE_PROJECT_ID }}
        run: |
          if [ -z "$PROJECT_ID" ]; then
            echo "::error::UNMEASURED — RUNGATE_PROJECT_ID is not set, so there is no board to write."
            exit 1
          fi
          bun scripts/board-mirror.ts --project "$PROJECT_ID" --write
