# Not managed by rungate — the scaffold owns ci.yml, gates.yml and the two
# ai-review files. This one is caller-owned.
#
# Increment 1 of specs/BOARD-FLOW-SPEC.md. Drives throwaway issues through
# every board lane on REAL events and reports what each lane did.
#
# **Dispatch only, and that is not laziness.** This workflow creates and
# deletes real issues, a real branch and a real pull request, and it merges
# that pull request into main. A schedule would do all of that unattended,
# and a cron is the thing #1744 was filed to remove. There is no `schedule:`
# trigger here and `test/board-walkthrough.test.ts` asserts its absence.
#
# **Rows 3 and 6 are expected RED.** Nothing writes In progress or Cancelled
# today. They ship red on purpose: a failing row naming the lane that did not
# move is worth more than the absence of a test, and it is how we learn a
# lane started working rather than being told it has. The driver reports
# those as EXPECTED_RED and does not fail the run on them — but it emits a
# loud UNEXPECTED_PASS warning if one of them ever starts passing.
#
# Every `uses:` is pinned to a commit SHA, as `test/action-pin-parity.test.ts`
# requires.
name: Board — drive one issue through every lane, for real

on:
  workflow_dispatch:
    inputs:
      wait-seconds:
        description: "How long to wait for a lane to move before calling it a failure"
        required: false
        default: "90"
        type: string

permissions:
  contents: read

jobs:
  walk-every-lane:
    runs-on: "ubuntu-latest"
    steps:
      # THE SECRET IS `RUNGATE_PROJECT_TOKEN`; THE ENV VAR IS
      # `BOARD_PROJECT_TOKEN`. Two names on purpose — `readBoardCredential`
      # in `lib/board-ready-fanout.ts` reads the env var, and the repository
      # secret is the one that exists. Do not "tidy" either into the other:
      # `secrets.<name>` for an absent secret is the EMPTY STRING with no
      # error, and that is how the Ready lane spent a day reporting green
      # while authorising itself with nothing.
      #
      # GITHUB_TOKEN cannot write ProjectsV2, which is why this is a PAT.
      - id: gate
        name: Is this the repository owner?
        env:
          ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
        run: |
          # This job merges a pull request into main and deletes issues.
          # `workflow_dispatch` already requires write access, so the owner
          # check is a second lock rather than the only one — but the
          # permission endpoint needs admin access that GITHUB_TOKEN does not
          # have, which is the fault that cost PRs #1765 and #1766. The
          # identity comparison needs no API call and cannot come back
          # UNMEASURED.
          if [ "$ACTOR" = "$OWNER" ]; then
            echo "trusted=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::refusing to run: $ACTOR is not $OWNER, and this job creates, merges and deletes."
            echo "trusted=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.gate.outputs.trusted == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
      - if: steps.gate.outputs.trusted == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.0.2
        with:
          bun-version-file: ".bun-version"
      # `--ignore-scripts`: this job carries a PAT, and a postinstall script
      # in any transitive dependency would run as the job.
      - if: steps.gate.outputs.trusted == 'true'
        run: bun install --frozen-lockfile --ignore-scripts

      # No `continue-on-error`. A red run IS the signal — this workflow exists
      # to report that a lane did not move, and swallowing that turns every
      # GraphQL error, bad argument and missing Ready option into green.
      - name: Walk every lane
        if: steps.gate.outputs.trusted == 'true'
        env:
          BOARD_PROJECT_TOKEN: ${{ secrets.RUNGATE_PROJECT_TOKEN }}
          PROJECT_ID: ${{ vars.RUNGATE_PROJECT_ID }}
          WAIT: ${{ inputs.wait-seconds }}
        run: |
          if [ -z "$PROJECT_ID" ]; then
            echo "::warning::UNMEASURED — RUNGATE_PROJECT_ID is not set, so there is no board to read."
            exit 1
          fi
          bun scripts/board-walkthrough.ts \
            --repo "$GITHUB_REPOSITORY" \
            --project "$PROJECT_ID" \
            --wait-seconds "$WAIT"
