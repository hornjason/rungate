# Not managed by rungate — the scaffold owns ci.yml, gates.yml and the two
# ai-review files, and regenerates them by job name. This one is caller-owned.
#
# SC-2738 (ADR-013 row 5, closes #1945's E4): merging an ADR whose status
# changes to accepted places its plan on the board, with no command typed by
# hand. Before this, step 4 of the four-step process was a person running five
# commands in order, and ADR-013's first dry run found the order links had
# never been written.
#
# The five commands, in the order each needs the one before it:
#
#   plan-spec      the engine spec's milestones, so every row's milestone exists
#   plan-issues    the ADR's Decomposition rows become issues, with blocked-by
#   plan-deps      the phase-order links between milestones
#   board-mirror   the Criteria column on the board
#   board-ready    a Ready top-up, because issues created with GITHUB_TOKEN
#                  fire no `issues: opened` run of board-ready.yml
#
# Every one is idempotent, so a re-run (or a second accepted ADR in the same
# push) writes only what is missing. An edit to an ADR that was ALREADY
# accepted lists nothing and every step after the read is skipped.
#
# CREDENTIALS, SPLIT BY STEP. The issue, milestone and edge writes use the
# job's own GITHUB_TOKEN, passed as GITHUB_TOKEN because plan-issues drops
# GH_TOKEN. RUNGATE_PROJECT_TOKEN reaches only the two board steps, in their
# own env, and is never widened (#1761 is what a widened or misnamed board
# token cost). GITHUB_TOKEN cannot write ProjectsV2, which is why those two
# steps hold the PAT at all.
#
# No trust gate like board-ready.yml's: this fires only on a push to main,
# which branch protection limits to a merge by somebody with write access.
#
# Every `uses:` is pinned to a commit SHA, and `test/action-pin-parity.test.ts`
# asserts it.
name: ADR accepted — place its plan on the board

on:
  push:
    branches: [main]
    paths: ["docs/adr/**"]

permissions:
  contents: read
  # Issues, milestones and blocked-by edges. Nothing else this job writes is
  # reachable with GITHUB_TOKEN.
  issues: write

# Two merges in quick succession must not race each other's issue creation:
# the second run reads the tracker the first one wrote.
concurrency:
  group: adr-accepted
  cancel-in-progress: false

jobs:
  place-the-plan:
    runs-on: "ubuntu-latest"
    steps:
      # fetch-depth 0: the acceptance read compares each ADR with the commit
      # before this push, and refuses when that commit is not in the clone.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.0.2
        with:
          bun-version-file: ".bun-version"
      # `--ignore-scripts`: two later steps hold a PAT, and a postinstall
      # script in any transitive dependency runs as the job.
      - run: bun install --frozen-lockfile --ignore-scripts

      # Which ADRs did this push accept, and where do the engine's milestones
      # come from? The config is read through lib/config-readers.ts, the one
      # loader, never by path. An unconfigured engine family is a red run, not
      # a skipped step: a skipped step reads as satisfied.
      - id: accepted
        name: Which ADRs did this push accept?
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          bun scripts/plan-issues.ts --accepted-since "$BEFORE" > accepted.txt
          echo "Accepted by this push:"
          cat accepted.txt
          if [ ! -s accepted.txt ]; then
            echo "any=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          spec=$(bun -e 'import { readBoardInputs } from "./lib/config-readers"; process.stdout.write(readBoardInputs(".").engineSpec ?? "")')
          prefix=$(bun -e 'import { readBoardInputs } from "./lib/config-readers"; process.stdout.write(readBoardInputs(".").milestonePrefix ?? "")')
          if [ -z "$spec" ] || [ -z "$prefix" ]; then
            echo "::error::UNMEASURED — board.engineSpec and board.milestonePrefix must both be set in .claude/rungate/config.json to place a plan. Nothing was written."
            exit 1
          fi
          # A newline in either would write a second key into GITHUB_OUTPUT
          # (security review of #2009).
          case "$spec$prefix" in
            *$'\n'*)
              echo "::error::board.engineSpec or board.milestonePrefix contains a newline. Nothing was written."
              exit 1
              ;;
          esac
          {
            echo "any=true"
            echo "spec=$spec"
            echo "prefix=$prefix"
          } >> "$GITHUB_OUTPUT"

      - name: Milestones from the engine spec's placement table
        if: steps.accepted.outputs.any == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SPEC: ${{ steps.accepted.outputs.spec }}
          PREFIX: ${{ steps.accepted.outputs.prefix }}
        run: bun scripts/plan-spec.ts "$SPEC" --repo "$GITHUB_REPOSITORY" --prefix "$PREFIX" --write

      # One ADR at a time; `bash -e` stops at the first refusal, so a plan the
      # filing tool refuses is a red run naming the ADR.
      - name: Issues and blocked-by edges from each accepted ADR
        if: steps.accepted.outputs.any == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          while IFS= read -r adr; do
            echo "== $adr"
            bun scripts/plan-issues.ts --decompose "$adr" --repo "$GITHUB_REPOSITORY" --write
          done < accepted.txt

      - name: Phase-order links between milestones
        if: steps.accepted.outputs.any == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREFIX: ${{ steps.accepted.outputs.prefix }}
        run: bun scripts/plan-deps.ts --repo "$GITHUB_REPOSITORY" --milestone-prefix "$PREFIX" --write

      # The board steps. THE SECRET IS `RUNGATE_PROJECT_TOKEN`: board-mirror
      # reads it as GITHUB_TOKEN, board-ready as BOARD_PROJECT_TOKEN. An
      # absent secret is the empty string with no error, so each script's own
      # UNMEASURED refusal is what reports it.
      - name: Criteria column on the board
        if: steps.accepted.outputs.any == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.RUNGATE_PROJECT_TOKEN }}
          PROJECT_ID: ${{ vars.RUNGATE_PROJECT_ID }}
        run: |
          if [ -z "$PROJECT_ID" ]; then
            echo "::error::UNMEASURED — RUNGATE_PROJECT_ID is not set, so there is no board to write."
            exit 1
          fi
          bun scripts/board-mirror.ts --project "$PROJECT_ID" --write

      - name: Top up Ready from the new issues
        if: steps.accepted.outputs.any == 'true'
        env:
          BOARD_PROJECT_TOKEN: ${{ secrets.RUNGATE_PROJECT_TOKEN }}
          PROJECT_ID: ${{ vars.RUNGATE_PROJECT_ID }}
          ACTOR: ${{ github.actor }}
        run: bun scripts/board-ready.ts --repo "$GITHUB_REPOSITORY" --project "$PROJECT_ID" --actor "$ACTOR" --top-up --write
