# Not managed by rungate. The scaffold regenerates the `test` job in ci.yml and
# the `gates` job in gates.yml by name; this file is caller-owned and is carried
# forward untouched on re-scaffold.
#
# #364 — rungate had no publish step at all. npm served 0.2.1 while main was 741
# commits past it, so every measurement in SUCCESS.md described software nobody
# could install.
#
# The two guard steps are the point of this file, not the publish step. A release
# pipeline has a quiet way of doing nothing: a skipped `if:`, a swallowed error,
# or a duplicate version npm rejects — all of which leave a green job and a real
# tag. So the registry's published-versions list is read BEFORE (the version must
# not be there yet) and AFTER (it must be there now). Neither reading is
# sufficient alone; see lib/release-preflight.ts.
#
# The postflight reads the VERSIONS LIST and not `dist-tags.latest` (#445). A
# dist-tag is a pointer that moves on its own schedule, and reading it to answer
# "did the publish take effect" reported both of this project's successful
# releases as failures. When the postflight cannot see the version inside its
# budget it exits 2 and prints RELEASE UNCONFIRMED rather than 1 and RELEASE
# REFUSED: a stale read and a failed publish are indistinguishable from here, so
# the step stops the job without naming a cause it has not established.
#
# Do not add `continue-on-error` to any step here, and do not guard `npm publish`
# behind a condition. test/release-guard.test.ts asserts both, because either one
# turns this whole file back into a job that reports a release it never made.
#
# EVERY `uses:` IS PINNED TO A COMMIT SHA, and a test asserts it. This job can
# mint an npm credential from `id-token: write`, so a third-party action
# referenced by a movable tag is a path to the registry. The tag is the
# publisher's to repoint at any time; the SHA is not. Scoping permissions to the
# publish step is not enough — an earlier step runs in the same workspace and can
# poison what the later one executes. Found by the commit security review.
#
# AUTHENTICATION IS OIDC (trusted publishing), NOT A TOKEN — and that is a
# correctness decision, not a preference. A granular token with "Bypass 2FA"
# could publish 0.3.0 today and npm REMOVES direct publishing by token in
# January 2027, so the token route had a three-month life and a rotation
# deadline attached to it. OIDC has no secret to leak, rotate or expire.
#
# Consequences a reader needs, each of which cost a failed run to learn:
#
#   - npm CLI >= 11.5.1 and Node >= 22.14.0. `setup-node` with node 22 ships
#     npm 10.x, which does NOT support OIDC, so npm is upgraded explicitly
#     below. Without that step the publish falls back to looking for a token
#     and fails for a reason that reads like a missing secret.
#   - `package.json` `repository.url` must EXACTLY match the GitHub repo, or
#     the registry refuses to match the OIDC claim. It was absent entirely.
#   - no `--provenance` flag: provenance is automatic under OIDC.
#   - no `NODE_AUTH_TOKEN`, and no `NPM_TOKEN` secret is read by this file.
#
# npm does not validate a trusted-publisher configuration when it is saved, and
# every field in it is case-sensitive, so a typo there surfaces only here.
name: Release

on:
  push:
    tags:
      - "v*"

# Workflow-level default is READ ONLY. `id-token: write` is granted on the one
# job that publishes, not here — a workflow-level grant applies to every job the
# file ever grows, and under OIDC that permission is no longer "allow provenance
# signing", it IS the credential that can publish the package. A second job
# added later for changelogs or notifications would silently inherit the ability
# to publish. Found by the commit security review.
permissions:
  contents: read

jobs:
  release:
    # The image ci.yml tests on, never `ubuntu-latest` (#2145). The full suite
    # runs here before `npm publish`, so this must be the environment the
    # suite is known green in. `ubuntu-latest` moved to ubuntu-26.04 between
    # v0.8.14 (2026-11-07, green on 24.04) and v0.8.15 (2026-11-14), and 23
    # tests that pass on 24.04 failed there: v0.8.15 published nothing.
    runs-on: "ubuntu-24.04"
    permissions:
      contents: read
      id-token: write # the OIDC credential npm publish authenticates with
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1

      # This job checks out a TAG, and a tag checkout is shallow and carries
      # no branches, so `origin/main` does not exist in it. Two guards in the
      # suite compare against that ref — the conformity allowlist ratchet
      # (#302) and the project-state currency check — and both correctly
      # refuse an unreadable base rather than reading it as clean. That made
      # the v0.3.0 release job fail at `bun test` with two UNMEASURED
      # refusals, which is the guards working and the checkout being wrong.
      #
      # ci.yml fetches the same ref for the same reason. It tolerates a
      # failed fetch with a warning; this does NOT, and the difference is
      # deliberate: a release is irreversible, so "could not measure" has to
      # stop the pipeline where it happened rather than surface three steps
      # later as a test failure nobody reads as an environment fault.
      #
      # A THIRD guard needs this fetch and was not in the list above, which
      # is why `--no-tags --depth=200` was wrong in two independent ways and
      # no release could ever pass (#1067). `publishedTagDistance` probes
      # `v<published>^{commit}` with plain git and reports `commitsAhead:
      # null` when it is absent, and `test/distribution-currency.test.ts`
      # refuses a null — correctly, because a reading nobody took is not a
      # reading that passed. So:
      #
      #   --no-tags   removed the PUBLISHED tag, which is the one thing that
      #               probe needs. The tag being released is HEAD; the tag it
      #               measures FROM is the previous release's, and nothing in
      #               a tag checkout carries it.
      #   --depth=200 was a number nobody maintains. Measured 2026-10-22:
      #               `v0.6.0..origin/main` is 223 commits, so even with tags
      #               fetched the PATH between them is outside a 200-commit
      #               window and `rev-list --count` cannot walk it. It was
      #               adequate when written and stopped being so without
      #               anything in this file changing — the margin is set by
      #               how many commits a release cycle accumulates, which is
      #               not a quantity this workflow owns.
      #
      # Both are replaced by full history rather than by a bigger number,
      # because a bigger number fails again at the next long cycle and fails
      # the same silent way: a reading that could not be taken, surfacing as
      # a red assertion three steps from its cause.
      - name: Fetch the comparison base and the published tag
        run: git fetch origin '+refs/heads/main:refs/remotes/origin/main' '+refs/tags/*:refs/tags/*'

      # Pinned, not "latest". The header argues this for every `uses:` and the
      # argument is the same for a RUNTIME fetched at job time: this job can
      # mint a credential that publishes the package, so anything mutable it
      # downloads is a path to the registry. Pinning the action to a SHA and
      # then asking it for whatever shipped this morning closes the front door
      # and leaves the window open. Found by the commit security review.
      #
      # The pin moved into `.bun-version` in #622 and is no stronger or weaker
      # for it: the file is in the repository, so a tag resolves it to exactly
      # one version the same way a literal here did. What changed is that this
      # was the THIRD spelling of the runtime in four workflow files — the
      # other two said `latest` — and a pin nobody compares to anything is a
      # pin that drifts from the runtime everything else was tested on.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.0.2
        with:
          bun-version-file: ".bun-version"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # OIDC needs npm >= 11.5.1 and node 22 ships 10.x. Asserted rather than
      # assumed: an npm too old to speak OIDC does not say so, it looks for a
      # token, finds none and reports an auth failure that sends you to the
      # secrets page instead of to this line.
      - name: Upgrade npm to a version that supports OIDC
        run: |
          set -euo pipefail
          # An EXACT version, not `@latest`. `npm@latest` is mutable and this
          # job can mint a credential that publishes the package, so a
          # compromised npm release would run with publish rights. The header
          # makes this argument for every `uses:`; it applies at least as
          # strongly to a package manager installed at job time. Raise the pin
          # deliberately. Found by the commit security review.
          npm install -g npm@11.16.0
          have="$(npm --version)"
          floor="11.5.1"
          # `sort -V` picks the lower of the two; if that is not the floor then
          # the installed npm is below it. The check refuses rather than warns:
          # an unmeasured npm version is the whole failure mode above.
          if [ "$(printf '%s\n%s\n' "$have" "$floor" | sort -V | head -n1)" != "$floor" ]; then
            echo "npm $have cannot publish via OIDC; $floor is the floor" >&2
            exit 1
          fi
          echo "npm $have supports OIDC"

      - run: bun install

      # Before anything irreversible: the tag must name the version in
      # package.json, and that version must not already be on the registry.
      # RELEASE_TAG goes through `env:`, not `${{ }}` inside the run script. A
      # tag name is attacker-shaped text — git permits quotes and semicolons in
      # one — and interpolating it into a shell command is the workflow
      # injection GitHub's own guidance opens with. The guard reads it from the
      # environment, so the shell never parses it.
      - name: Preflight — this release has not already been cut
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: bun scripts/release-guard.ts --phase preflight --tag "$RELEASE_TAG"

      # The published artifact is the thing claim 5 is about, so it is tested
      # before it ships and not only on main.
      - run: bun test
        env:
          # The same secret `ci.yml` hands the sharded suite, and for the same
          # reason: `test/stage-ladder.test.ts` executes every DONE item's
          # verify command, and those run `board-conformance` against a
          # ProjectV2 board. Without it all 27 of them exit 1 on
          # "GITHUB_TOKEN environment variable is not set" and the release
          # cannot be cut — which is what happened to v0.8.9 (run
          # 41649310261), twice. The built-in token is repository-scoped and
          # cannot see a board, so it is not a substitute.
          GITHUB_TOKEN: ${{ secrets.RUNGATE_PROJECT_TOKEN }}
      - run: bun scripts/typecheck.ts

      # No token and no `--provenance`. Authentication is the OIDC credential
      # minted from `id-token: write`, and provenance is produced automatically
      # under it. Adding NODE_AUTH_TOKEN back would silently prefer the token
      # over OIDC and reinstate the January 2027 deadline this removed.
      # The output is CAPTURED, because npm's `+ rungate@x.y.z` line is the
      # receipt the postflight reads (#472). `set -o pipefail` keeps npm's own
      # exit status authoritative through the pipe — without it `tee` succeeds
      # and a failed publish reads as a clean one, which is this file's whole
      # subject. `tee` and not `>` so the log still appears in the job output.
      - name: Publish
        run: |
          set -euo pipefail
          npm publish --access public 2>&1 | tee "$RUNNER_TEMP/publish.log"

      # The half that cannot be satisfied by doing nothing.
      #
      # It now reads TWO things, and they answer different questions (#472).
      # The receipt says whether npm ACCEPTED the publish and is written
      # synchronously; the packument says whether the registry SERVES it and
      # is eventually consistent. Three consecutive releases published fine
      # and were reported as failures because only the slow one was asked —
      # 0.4.1 missed its 120s budget by 48 seconds.
      #
      # Removing `--publish-log` does not switch the check off: with no
      # receipt the guard falls back to refusing an unconfirmed read exactly
      # as it did before, and test/release-guard.test.ts drives both paths.
      #
      # THE NAME ASKS THE QUESTION; IT DOES NOT ANSWER IT (#1563). It used to
      # read "the registry actually serves this version", and on v0.8.3 the
      # step exited 0 having printed, in its own message, that it had taken no
      # such reading: PROPAGATION PENDING, 25 reads over 120s, with `npm view
      # rungate version --prefer-online` returning 0.8.2 from outside CI. Both
      # of `postflightDecision`'s green readings produce the same name and the
      # same conclusion, so the name is the one thing in the run summary that
      # cannot be wrong — which is why it must not assert either of them.
      #
      # The reading is NOT available here, and that is why the title moved
      # rather than the check. The packument is CDN-fronted and eventually
      # consistent; v0.8.1 took about 16 minutes against a 120s budget. #407
      # already tried waiting longer and #445 recorded it as a bigger guess
      # rather than a different mechanism.
      #
      # Which reading was taken now leaves the log: the guard prints a
      # `::notice` annotation carrying the verdict, so PROPAGATION PENDING and
      # REGISTRY SERVES differ in the run summary and not only 5.7 MB into a
      # log body.
      - name: Postflight — what the registry says about this version
        run: bun scripts/release-guard.ts --phase postflight --publish-log "$RUNNER_TEMP/publish.log"
