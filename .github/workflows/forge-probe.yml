# Not managed by rungate. This repository's own probe of the forge behaviours
# its tools rest on (#1910): scripts/probe-forge-behaviour.ts, one reading per
# behaviour, CONFIRMED, CHANGED or UNMEASURED.
#
# Deliberately NOT generated into consumers and NOT scheduled:
#   - not generated, because the inventory is this repository's tools and its
#     fixture is one of its own pull requests.
#   - not scheduled, because it asks GitHub a question, and a question asked on
#     a timer goes red when GitHub is slow. Press the button when you want to
#     know whether a behaviour still holds, for example after a bun upgrade.
# The run exits non-zero for anything but CONFIRMED, so a red run is a reading
# to look at, never a gate.
name: Forge probe

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          # Pinned by .bun-version — the project's single declaration (#622).
          # The timeout row reads THIS bun, which is the point of running here.
          bun-version-file: ".bun-version"
      - name: Read every behaviour
        env:
          # `gh pr view` reads the merged fixture. Without a token that row
          # reads UNMEASURED, which is correct and is not the question asked.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun scripts/probe-forge-behaviour.ts --repo "$GITHUB_REPOSITORY"
