#
# SC-2784 (ADR-020 Decision 2): a consumer's issue is triaged when it is filed
# or labelled from-consumer, and every day, by consumer-triage --write.
# An outside reporter's new issue is given from-consumer first, because
# GitHub drops the labels an author without push access sets.
name: Consumer issues — give each one a triage verdict

on:
  issues:
    types: [opened, labeled]
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: read
  # Milestones, labels and the verdict comment.
  issues: write
  # The triage reads open pull requests for shared files.
  pull-requests: read

concurrency:
  group: consumer-intake
  cancel-in-progress: false

jobs:
  triage:
    if: ${{ github.event_name == 'schedule' || github.event.action == 'opened' || (github.event.action == 'labeled' && github.event.label.name == 'from-consumer') }}
    runs-on: "ubuntu-24.04"
    steps:
      - name: Give an outside reporter's issue the from-consumer label
        # Not a bot: the pipeline's own plan issues are authored by
        # github-actions[bot], association NONE (#2390).
        if: ${{ !contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association) && github.event.issue.user.type != 'Bot' && github.event.action == 'opened' }}
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
        run: gh issue edit "$NUMBER" --repo "$GITHUB_REPOSITORY" --add-label from-consumer

      - name: Give an outside reporter's recent issue the from-consumer label, if its opened run was missed
        if: ${{ github.event_name == 'schedule' }}
        # A failed sweep is shown, and the triage below still runs on the
        # issues that already carry the label (review of #2380).
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TRUSTED: '["OWNER","MEMBER","COLLABORATOR"]'
        run: |
          # An unspecified run shell is `bash -e` with no pipefail, so a failed
          # read would end in a clean exit with nothing labelled.
          set -o pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/issues?state=open&per_page=100" --jq '.[] | select(.pull_request == null) | select(.created_at >= (now - 172800 | todate)) | select(.user.type != "Bot") | select(.author_association as $a | env.TRUSTED | fromjson | index($a) | not) | select([.labels[].name] | index("from-consumer") | not) | .number' \
            | while read -r n; do
                # A person took the label off: leave it off (review of #2380).
                # An unreadable history labels nothing, rather than guessing.
                removed="$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$n/events?per_page=100" --jq '.[] | select(.event == "unlabeled" and .label.name == "from-consumer") | .id')" \
                  || { echo "::warning title=consumer-intake::could not read #$n's history; not labelled this run"; continue; }
                if [ -n "$removed" ]; then
                  echo "#$n: from-consumer was removed by hand, not put back"
                  continue
                fi
                gh issue edit "$n" --repo "$GITHUB_REPOSITORY" --add-label from-consumer \
                  || echo "::warning title=consumer-intake::could not label #$n; the next run tries again"
              done

      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          # Pinned by .bun-version — the project's single declaration (#622).
          # setup-bun reads that file, so there is no version spelled here to drift from it.
          bun-version-file: ".bun-version"
        env:
          # A per-runner install path, so runners sharing a HOME cannot rewrite
          # each other's bun mid-exec ("Text file busy").
          HOME: ${{ runner.tool_cache }}/bun-home
          USERPROFILE: ${{ runner.tool_cache }}/bun-home
      - name: Triage every consumer issue that has no verdict
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bunx rungate@0.8.39 consumer-triage --repo "$GITHUB_REPOSITORY" --write
